# Config for build_latent_buffer.py
#
# Usage:
#   python build_latent_buffer.py env=pointmaze
#   python build_latent_buffer.py env=pusht latent_key=visual
#   python build_latent_buffer.py env=lewm_reacher

env: null  # pointmaze, pusht, lewm_reacher, lewm_cube

# Which latent key to extract (DINO-WM only; LeWM always uses visual)
latent_key: proprio  # 'proprio' or 'visual'

# DINO-WM checkpoint directory (ignored for LeWM)
checkpoint_dir: ./checkpoints/pointmaze

# LeWM checkpoint base path (ignored for DINO-WM)
ckpt_base_path: /scratch/gilbreth/hviswan/grasp/checkpoints

# Output path for the replay buffer
output_path: /scratch/gilbreth/hviswan/grasp/latent_buffers/${env}_buffer.pt

# Max episodes to encode
max_episodes: 8000
