_target_: planning.fk_planner.FKSMCPlanner
horizon: 5
opt_steps: 300
eval_every: 1

# Population + AIS/SMC-sampler mechanics (see fk-smc-planner-design memory).
num_particles: 32
num_langevin_steps: 1
# lr + annealed action_reg match conf/planner/gd_reacher.yaml -- the kernel
# configuration verified to solve seeds 9/10 (population-of-8, no heat
# guidance, plan_outputs/20260717223114). The regularizer is gd.py's
# anti-exploitation device; dropping it was why the FK kernel failed there.
langevin_lr: 0.1
action_reg: 0.1
# Per-particle Gaussian loss smoothing with annealed sigma -- the actual
# mechanism behind gd_reacher's 93%: each step evaluates the loss at
# num_smooth_samples noised copies of each particle (sigma annealed
# smooth_sigma -> 0) and descends the mean. Matches gd_reacher's
# num_samples=8 / var_actions=1.0.
num_smooth_samples: 8
smooth_sigma: 1.0
langevin_temp: 0.001
beta_max: 1.0
# Particle init spread: SMC over identical particles is vanilla GD by
# construction, so particles start at init + N(0, init_std^2).
init_std: 1.0
# Adaptive tempering + ESS-triggered resampling (replaces the old fixed
# linear beta ramp + resample_interval timer, whose per-window tilt exponent
# beta_max*interval/opt_steps was provably too small to ever move a particle).
ess_target_frac: 0.5

action_clamp: 0

# Same buffer/graph settings as gd_reacher_heat_dir.yaml -- that config is
# the direct ablation partner (single chain, grad(V) in drift, no
# resampling), so keeping the graph identical isolates what population +
# AIS resampling contribute on top of it.
# Same buffer/graph settings as gd_reacher_heat_dir.yaml -- direct A/B on
# seed 4 confirmed guidance_mode=scalar + solver_mode=heat succeeds (MSE
# 0.058, step 9) via GDPlanner, so 'heat' is fine; a Euclidean-agreement
# diagnostic against it was the wrong validation metric (this graph encodes
# dynamics reachability, not spatial proximity) -- do not re-litigate this.
# lewm_reacher_buffer.pt is the OLD broken buffer (encoded without the
# ImageNet transform -- see build_latent_buffer.py's warning comment): its
# graph sits ~161 scaled units from every latent the planner queries, so V
# lookups were noise (verified 2026-08-21: fresh encodings match _fixed
# rows to 0.0, and are ~14x the data scale away from the old buffer's).
replay_buffer_path: ${oc.env:GRASP_BUFFER_DIR,${hydra:runtime.cwd}/latent_buffers}/lewm_reacher_fixed.pt
latent_key: visual
solver_mode: heat
rw_steps: 20
graph_k_neighbors: 64
use_full_dim: true
graph_n_nodes: 55000
use_isomap: false

name: fk
