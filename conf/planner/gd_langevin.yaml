_target_: planning.gd_langevin.GDLangevinPlanner
horizon: 5
sample_type: 'randn' # 'zero' or 'randn'

lr: 0.1
opt_steps: 1000
eval_every: 10
var_actions: 0.0
var_states: 0.0
num_samples: 1
action_clamp: 0 # clamp value for actions; 0 means no clamping

# Latent replay buffer for heat-equation value function
replay_buffer_path: /scratch/gilbreth/hviswan/dino_wm/pointmaze_offline_replay_buffer.pt
latent_key: proprio  # 'proprio' (pointmaze) or 'visual' (pusht, lewm)

hjb_tau: 0.1  # weight for V guidance at terminal state

# Langevin noise shaping parameters
num_langevin_steps: 10
langevin_alpha_base: 0.001  # pointmaze: 0.001, pusht: 0.1
langevin_gamma: 0.001       # pointmaze: 1e-3, pusht: 1e-2
langevin_trust_radius: 0.2

name: gd_langevin
