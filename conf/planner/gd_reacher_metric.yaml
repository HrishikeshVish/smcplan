_target_: planning.gd.GDPlanner
horizon: 5
sample_type: 'zero'

lr: 0.1
opt_steps: 300
eval_every: 1
var_actions: 0.0
var_states: 0.0
num_samples: 1
action_clamp: 0
action_reg: 0.0

replay_buffer_path: /scratch/gilbreth/hviswan/grasp/latent_buffers/lewm_reacher_buffer.pt
latent_key: visual

hjb_tau: 0.002
solver_mode: rw_diffusion
rw_steps: 20
graph_k_neighbors: 64
use_full_dim: true
graph_n_nodes: 55000
# NOTE: despite this file's name, isomap is OFF. The shipped runs behind
# seed_success_log.txt used random-walk diffusion on a Euclidean kNN graph in
# full 192-D. Set to true to actually get geodesic (Dijkstra) kNN.
use_isomap: false

name: gd_reacher_metric

# Diagonal latent metric learned from TEMPORAL pairs only (no state labels,
# no decoder). Reweights the terminal term onto task-relevant latent dims.
metric_weights_path: /home/hviswan/Documents/grasp/latent_buffers/reacher_metric_temporal.npy
