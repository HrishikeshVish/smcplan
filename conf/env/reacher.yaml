name: lewm_reacher

# LeWM checkpoint folder name (under ckpt_base_path/outputs/)
lewm_checkpoint: lewm_reacher

# Dataset
dataset:
  _target_: dsets.dmcontrol_dset.load_dmcontrol_dataset
  data_path: ${oc.env:DATASET_DIR}/dmc/reacher.h5
  num_hist: 3
  num_pred: 1
  frameskip: 5
  img_size: 224

# Env (used for rollout evaluation)
env_name: swm/ReacherDMControl-v0
max_episode_steps: 50
image_size: 224
task: qpos_match

# LeWM config
history_size: 3
action_dim: 2
proprio_dim: 0

# Eval config (matching le-wm)
goal_offset_steps: 25
eval_budget: 50

decoder_path: null
num_workers: 4
